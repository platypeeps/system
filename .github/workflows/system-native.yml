name: System native tests

on:
  pull_request:
    # `edited` as well as the defaults: rule 5 reads the pull request body,
    # and a re-run replays the old body, so fixing a `Work:` line has to
    # start a fresh run. Editing the title reruns the legs too.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: system-native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  system-native:
    # One leg per long suite and one for the short ones, in parallel. The
    # serial job took six and a half minutes on every pull request and push:
    # sd-db about two, the dashboard and the runner under two each, the other
    # seven under ten seconds together. Each leg repeats the preflight -- the
    # fixture check, the lint, the unwired-suite guard, the library install --
    # because it costs under half a minute and needs no artifact handed
    # between jobs. The trade is billed minutes: eight checkout steps and
    # four venvs instead of two and one, roughly ten minutes a run instead of
    # seven, for a wall clock of about three (sd:558).
    #
    # Every leg runs on Linux. What only macOS has -- APFS immutable
    # retention (`chflags uchg`), clonefile seeds (`cp -c`), diskutil, and
    # msgsnap's swiftc build and DYLD_INSERT_LIBRARIES shim -- lives in
    # suites named in tests/macos-only-suites.txt, which
    # tests/run-macos-only.sh runs on a Mac. A skip here would fail the leg,
    # so those suites are split out rather than skipped. The job name and the
    # four leg names are unchanged, so the required checks stay the same.
    name: system-native (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        leg: [shared, dashboard, runner, tools]
    steps:
      - name: Check out system
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: system
          persist-credentials: false

      - name: Check out the public pack for ship acceptance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: platypeeps/sd-ai-command-pack
          # sd:1439: schema 14 stores repository paths as `~/` keys, and a
          # pack older than pack #1166 writes the absolute path, so
          # local-sd-plan's registration failed its foreign key. Pack #1166
          # merged as 6d6214f6.
          ref: 6d6214f6a9151d8cea36cfbf5b4ae695789eb9b6
          path: pack
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The runner image carries these today; naming them keeps a suite from
      # passing or failing on what the image happens to ship. sqlite3 is the
      # CLI the sd-db suites shell out to; lsof and ps are the process-holder
      # probes local-sd-runner and the dashboard read; rsync is what
      # local-ai-songs-backup mirrors with.
      - name: Install the command-line tools the suites call
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends git sqlite3 lsof procps rsync

      - name: Run the native suites in an isolated home
        shell: bash
        env:
          # Through the environment, never through ${{ }} inside the script:
          # a pull request body is attacker-controlled text, and interpolating
          # it into the shell would run whatever it contains.
          PR_BODY: ${{ github.event.pull_request.body }}
          SUITE_LEG: ${{ matrix.leg }}
        run: |
          set -euo pipefail
          ci_root="$(mktemp -d "$RUNNER_TEMP/system-native.XXXXXX")"
          # `.noindex` kept Spotlight off the suites' temp files when CI ran on
          # macOS, and still does on a Mac that runs this body by hand; Linux
          # ignores it. A fixture
          # clone rewritten mid-test and then indexed reads as a process holder
          # to local-sd-runner's `survivors`, which is how run 34700878618
          # failed test_archive_refresh on a PR that touched only sd-db.sh
          # (sd:554). mktemp wants its X's last, so the suffix goes on tmp.
          mkdir -p "$ci_root/home" "$ci_root/tmp.noindex"
          # Rule 5 reads the body from a file. A push to main has no pull
          # request, so the variable stays empty and the flag is not passed --
          # the rule then reports itself not run, which is what it did here
          # every run until now.
          pr_body=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pr_body="$ci_root/pr-body.md"
            printf '%s' "${PR_BODY:-}" > "$pr_body"
          fi
          # Test subprocesses inherit only this environment, never checkout tokens.
          # Leave XDG overrides unset so nested fixture homes select their own state.
          env -i PATH="$PATH" HOME="$ci_root/home" TMPDIR="$ci_root/tmp.noindex" \
            CI_WORK_ROOT="$ci_root" CI_SYSTEM_ROOT="$GITHUB_WORKSPACE/system" \
            SD_ACCEPTANCE_PACK="$GITHUB_WORKSPACE/pack" \
            SD_WRITING_MANIFEST="$GITHUB_WORKSPACE/system/.github/fixtures/writing-sd-plugin.json" \
            SD_PR_BODY="$pr_body" SUITE_LEG="$SUITE_LEG" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_OPTIONAL_LOCKS=0 \
            LANG=en_US.UTF-8 PYTHONDONTWRITEBYTECODE=1 NO_PROXY='*' no_proxy='*' \
            /bin/bash --noprofile --norc <<'CI'
          set -euo pipefail
          cd "$CI_SYSTEM_ROOT"
          # Every leg runs on Linux; the macOS-only suites never run here.
          test "$(uname -s)" = Linux
          # The preflight and the run_suite lines live in tests/ci-native.sh,
          # which `make check` runs too, so the two cannot drift.
          bash tests/ci-native.sh preflight
          bash tests/ci-native.sh leg "$SUITE_LEG"
          CI

  ci:
    # The one check name the fleet baseline requires (sd:1741). An
    # aggregate: its `needs` are exactly the legs the ruleset requires today,
    # so it gates what they gate and nothing more. `route` stays required
    # beside it (decision D2): it runs in another workflow, which `needs`
    # cannot reach. The ruleset still requires the four legs by name until
    # the plan's phase 2 swaps the list; adding this job changes no gate.
    # `!cancelled()`, not `always()`, and never an `if:` that skips: GitHub
    # counts a skipped required check as passing, so the step decides.
    # Keep the step exactly as design.md writes it: `sd_db.protection`
    # credits that shape only, and a test reads this job.
    name: ci
    needs: [system-native]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a needed job ended: $result"; exit 1; }
          done
