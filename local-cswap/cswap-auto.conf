# Config for the cswap-auto daemon. Sourced by `cswap.sh run`.
# Restart after editing: ./cswap.sh stop && ./cswap.sh start
#
# The ':=' form means precedence is: environment > this file > built-in default.

# Path to the cswap executable.
: "${CSWAP_BIN:=$HOME/.local/bin/cswap}"

# Flags for `cswap auto`. See `cswap auto --help`.
#   --interval SECONDS   poll interval (min 15, default 60)
#   --threshold PCT      switch at this utilization (default 90)
#   --model NAMES        also honor per-model weekly limits
#   --json               machine-readable one-event-per-line output
: "${CSWAP_AUTO_ARGS:=}"
