# Config for `cswap.sh sync`, which sources it on every run.
#
# The ':=' form means precedence is: environment > this file > built-in default.

# Path to the cswap executable.
: "${CSWAP_BIN:=$HOME/.local/bin/cswap}"

# Flags for the hub's `cswap auto --once` tick. See `cswap auto --help`.
# Sync adds `--strategy consume-first` after them, so that one wins.
#   --threshold PCT      switch at this utilization (default 90)
#   --model NAMES        also honor per-model weekly limits
: "${CSWAP_AUTO_ARGS:=}"
