receivers:
  otlp:
    protocols:
      # Every interface inside the container; the compose file publishes the
      # ports on 127.0.0.1 only. The collector's own default of localhost is
      # the container's loopback, which the published ports cannot reach.
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  otlp/phoenix:
    endpoint: phoenix:4317
    tls:
      insecure: true
  # The untouched OTLP JSON, one batch per line, for analysis outside Phoenix.
  # Rotated at 100 MB into traces-<UTC time>-<reason>.jsonl. max_backups 0
  # (and no max_days) keeps every rotated file: `genai-traces.sh archive` is
  # the only deleter, after it has a checked copy. The exporter's default is
  # 100, so 0 must stay explicit; status fails once 20 files wait on disk.
  file/raw:
    path: /out/traces.jsonl
    format: json
    rotation:
      max_megabytes: 100
      max_backups: 0
  # Metrics and log events (Claude Code's native OTel export sends these,
  # not spans): the same raw JSON and rotation, archived the same way.
  file/metrics:
    path: /out/metrics.jsonl
    format: json
    rotation:
      max_megabytes: 100
      max_backups: 0
  file/logs:
    path: /out/logs.jsonl
    format: json
    rotation:
      max_megabytes: 100
      max_backups: 0

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/phoenix, file/raw]
    # Phoenix takes traces only.
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs]
