<!doctype html>
<!--
  Tasks (sd:2124), at /tasks. Built from the design source's products/system/designs/v2/tasks.html at d82daa1, with design.md and commands.md.
  Data: /api/tasks (tasks_screen.document: the rows reads.backlog_items gives v1 /backlog, with each row's revision, allowed
  statuses and age bucket), read when the page opens and after a write; /api/tasks/<id> (tasks_screen.details: the sd task show <id> JSON split into
  status history and notes, the item's assignments, and its external context), read when a task is selected.
  The operator's issues (sd:4628) moved to Today's Issues view (sd:5645): this page keeps no copy.
  Realm, a filter in the bar (sd:5753): Personal, each realm, HOA or Home narrows the rows to the realm or area each row carries
  (places.realm_of, places.area_of), the HOA and Home pages' rule; All shows every row.
  Writes: the v1 action routes (status, edit, note resolve, capture) and task cancel (Close, sd:3012). Nothing here is sample data.
  A task's Details, commands and writes are task-details.js's (sd:5635), which the Home and realm place pages draw too.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasks · system</title>
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<script src="/ui/theme.js"></script>
<script src="/ui/markup.js"></script>
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/ui/tasks.css">
<link rel="stylesheet" href="/ui/task-details.css">
</head>
<body data-page="Tasks" data-scope="tasks">
<script src="/ui/icons.js"></script>
<div class="shell"><main id="main">
  <div class="head">
    <div>
      <h1>Tasks</h1>
      <p id="subhead">Reading the tasks…</p>
    </div>
  </div>

  <div id="state" hidden></div>
  <!-- The toolbar standard (sd:5281): row 1, add or find and the layouts; row 2, the filters, Realm first (sd:5753). -->
  <div class="toolbar" id="toolbar">
    <div class="shift" id="shift">
      <label class="sr" for="shift-in">Add or find a task</label>
      <div class="field">
        <svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>
        <input id="shift-in" autocomplete="off" spellcheck="false" placeholder="Add or find a task" aria-describedby="shift-ghost" aria-controls="shift-preview" aria-expanded="false">
        <span class="ghost" id="shift-ghost">p1 due fri #system</span>
        <button class="help" type="button" aria-label="Help: add or find" data-help="<b>One box adds or finds.</b> <code>p1</code>–<code>p4</code> set priority, <code>due fri</code> or <code>due 2026-10-02</code> a date, <code>#system</code> a repo shown on this page, <code>#1038</code> opens that task. The rest is the title. Enter files it in Planning with sd task add; Esc clears."><svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button>
      </div>
      <div class="preview" id="shift-preview" hidden></div>
    </div>
    <div class="views">
      <div class="viewpick">
        <button type="button" class="viewpick-btn" id="view-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="view-menu" aria-label="View: Board"><svg class="i" aria-hidden="true"><use href="#i-kanban"/></svg></button>
        <div class="actmenu viewmenu" id="view-menu" role="menu" aria-label="View" hidden>
          <button type="button" role="menuitemradio" data-view="list" aria-checked="false"><svg class="i" aria-hidden="true"><use href="#i-list-todo"/></svg><span>List</span><kbd>v l</kbd></button>
          <button type="button" role="menuitemradio" data-view="board" aria-checked="true"><svg class="i" aria-hidden="true"><use href="#i-kanban"/></svg><span>Board</span><kbd>v b</kbd></button>
          <button type="button" role="menuitemradio" data-view="matrix" aria-checked="false"><svg class="i" aria-hidden="true"><use href="#i-grid-2x2"/></svg><span>Matrix</span><kbd>v m</kbd></button>
        </div>
      </div>
      <button class="help" type="button" aria-label="Help: views" data-help="<b>List</b> sorts and filters every open task. <b>Board</b> has one column per status; a move saves at once with Undo, except Done on a repeating task, which asks first: it opens the next occurrence. <b>Matrix</b> places tasks by importance (priority 1–2) and urgency (the rule in <code>reads.is_urgent</code>: due within 7 days or overdue, a message ready to send for over 3 days, or a report that needs attention); a drop there edits priority or due."><svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button>
      <button class="btn quiet" type="button" id="start-next"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg><span class="txt">Start next</span></button>
      <button class="help" type="button" aria-label="Help: start next" data-help="<b>Start next</b> shows the next ready tasks first, then starts claude as a builder on each in herdr, as Fix does. At most 6 builders run on this machine, and none start while the five-minute load is above the gate's cap; a count or load that was not read starts nothing."><svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button>
    </div>
  </div>
  <div class="filters toolbar-2" id="filterbar" role="group" aria-label="Filters">
    <div class="ffind">
      <label class="label" for="find-in">Text</label>
      <input id="find-in" type="search" autocomplete="off" spellcheck="false" placeholder="title, #id, repo">
    </div>
    <div class="fset" id="filters"></div>
  </div>

  <section id="view-board" aria-label="Board"></section>
  <section id="view-matrix" aria-label="Eisenhower matrix" hidden></section>
  <section id="view-list" aria-label="List" hidden></section>

</main>
<div class="details" id="details"></div></div>
<script src="/ui/sections.js"></script>
<script src="/ui/read.js"></script>
<script src="/ui/commands.js"></script>
<script src="/ui/task-details.js"></script>
<script src="/ui/tasks.js"></script>
<script src="/ui/shell.js"></script>
</body>
</html>
