<!doctype html>
<!--
  Today, v2 (sd:2110), the default page at / and /today since sd:2163. Built from ui-design products/system/designs/v2/today.html at a3861c9 and design.md.
  One page, no tabs (sd:5921, docs/work/2026-10-23-today-queue/design.md): what is going on, then what needs you.
  Data: /api/now, the document now_screen.document builds, read when the page opens and on Refresh.
  The annunciator: Jobs, Lane, Reports, Pulls, Mail and Repos filter Needs you to their rows; Sessions opens In motion and
  Gate opens Queue. Each number counts the rows its filter shows.
  Needs you: the document's `needs`, every fact that asks for an act, ranked in the bands, with group rows for the work items
  and briefs. The rail badge counts its rows (now_screen._attention). One selection: ?row=, a group row too.
  In motion: each open item's live sessions (active_sessions.document), longest-running first; the tally counts the lanes.
  Snooze (sd:1896): /ui/snooze.js; a row's Snooze or Unsnooze posts /api/snooze, and Today reads again.
  The old views' addresses (#view=now|work|inbox|status) land here; Decisions moved to Decide and GitHub to GitHub (sd:5781).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today · system</title>
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<script src="/ui/theme.js"></script>
<script src="/ui/markup.js"></script>
<script src="/ui/annunciator-strip.js"></script>
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/ui/annunciator-strip.css">
<link rel="stylesheet" href="/ui/today.css">
<link rel="stylesheet" href="/ui/issues.css">
</head>
<body data-page="Today" data-scope="fleet">
<script src="/ui/icons.js"></script>
<div class="shell">
  <main>
    <header class="head">
      <div>
        <h1>Today</h1>
        <p id="subhead">Reading the fleet…</p>
      </div>
    </header>

    <h2 class="sr">Subsystems</h2>
    <annunciator-strip><ul class="annunciator" id="annunciator">
      <li><button class="cell" type="button" data-src="jobs" data-state="unknown" aria-pressed="false"><span class="lbl">Jobs<svg class="i" aria-hidden="true"><use href="#i-siren"/></svg></span><span class="val">reading…</span></button></li>
      <li><button class="cell" type="button" data-src="lane" data-state="unknown" aria-pressed="false"><span class="lbl">Lane<svg class="i" aria-hidden="true"><use href="#i-git-merge"/></svg></span><span class="val">reading…</span></button></li>
      <li><button class="cell" type="button" data-src="reports" data-state="unknown" aria-pressed="false"><span class="lbl">Reports<svg class="i" aria-hidden="true"><use href="#i-file-text"/></svg></span><span class="val">reading…</span></button></li>
      <li><button class="cell" type="button" data-src="pulls" data-state="unknown" aria-pressed="false"><span class="lbl">Pulls<svg class="i" aria-hidden="true"><use href="#i-git-pull-request"/></svg></span><span class="val">reading…</span></button></li>
      <li><button class="cell" type="button" data-src="mail" data-state="unknown" aria-pressed="false"><span class="lbl">Mail<svg class="i" aria-hidden="true"><use href="#i-mail"/></svg></span><span class="val">reading…</span></button></li>
      <li><button class="cell" type="button" data-src="repos" data-state="unknown" aria-pressed="false"><span class="lbl">Repos<svg class="i" aria-hidden="true"><use href="#i-hard-drive-download"/></svg></span><span class="val">reading…</span></button></li>
      <li><a class="cell" href="#motion-h" id="lamp-sessions" data-state="unknown"><span class="lbl">Sessions<svg class="i" aria-hidden="true"><use href="#i-bot"/></svg></span><span class="val">reading…</span></a></li>
      <li><a class="cell" href="/queue" id="lamp-gate" data-state="unknown"><span class="lbl">Gate<svg class="i" aria-hidden="true"><use href="#i-gauge"/></svg></span><span class="val">reading…</span></a></li>
      <li><button class="cell clock" type="button" id="refresh"><span class="lbl">Observed<svg class="i" aria-hidden="true"><use href="#i-rotate-ccw"/></svg></span><span class="val"><span class="ph" id="observed">not yet</span> · <span class="ph">refresh</span></span></button></li>
    </ul></annunciator-strip>

    <section aria-labelledby="needs-h">
      <div class="sec-head">
        <h2 id="needs-h">Needs you <button class="help" type="button" aria-label="Help: Needs you" data-help="&lt;b&gt;Everything that asks you to act, in one list.&lt;/b&gt; Broken first, then what to look at, then what is queued. Rows of one kind fold into one group row: open it for its first rows. A lamp above, or an intent, shows only its rows. Each row has one main action and the rest under ⋯. &lt;code&gt;sd today&lt;/code&gt; prints the full status.">
          <svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button></h2>
        <p class="tally" id="tally"></p>
      </div>
      <!-- The toolbar standard (sd:5281): the shell's Shapeshift bar (sd:5539), then the intents, views over the one list. -->
      <div class="toolbar" id="toolbar" data-shift></div>
      <div class="intents" id="intents" role="group" aria-label="Show only"></div>
      <table class="ledger needs" aria-labelledby="needs-h" data-tfilter="page" data-toolbar="toolbar">
        <thead id="rows-head"></thead>
        <tbody id="rows"><tr class="empty"><td colspan="6">Reading the fleet…</td></tr></tbody>
      </table>
      <p class="filtered" id="filtered" hidden></p>
      <p class="filtered" id="unread" role="status" hidden></p>
      <div id="snoozed"></div>
      <p class="foot" id="foot">Waiting elsewhere: <a href="/decide">Decide</a> holds the decisions and review questions, <a href="/health">Health</a> the findings. <code>sd today</code> prints the full status.</p>
    </section>

    <section aria-labelledby="motion-h">
      <div class="sec-head">
        <h2 id="motion-h">In motion <button class="help" type="button" aria-label="Help: In motion" data-help="&lt;b&gt;Open items with a live session.&lt;/b&gt; A worktree, a lane entry, a running &lt;code&gt;sd-*&lt;/code&gt; command or a herdr agent, each tied to its item by a lane entry, a branch name, &lt;code&gt;--item&lt;/code&gt;, &lt;code&gt;-C&lt;/code&gt; or a Fix note. Longest-running first. What landed today is on Queue.">
          <svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button></h2>
        <p class="tally" id="active-tally"></p>
      </div>
      <table class="ledger active" aria-labelledby="motion-h">
        <thead id="active-head"></thead>
        <tbody id="active"><tr class="empty"><td colspan="5">Reading sessions…</td></tr></tbody>
      </table>
      <p class="filtered" id="active-note" hidden></p>
    </section>
  </main>

  <div class="details" id="details"><p class="why">Reading the fleet…</p></div>
</div>
<script src="/ui/sections.js"></script>
<script src="/ui/read.js"></script>
<script src="/ui/snooze.js"></script>
<script src="/ui/commands.js"></script>
<script src="/ui/today.js"></script>
<script src="/ui/shell.js"></script>
</body>
</html>
