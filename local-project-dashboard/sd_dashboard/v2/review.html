<!doctype html>
<!--
  Review (sd:3709), at /review: the labelling queue (design docs/work/2026-10-12-review-queue, Queue UX). No design source
  page: built on the v2 shell from ui-design products/system/design.md (Rail: Review, g l; Keys: digits 1-9 on Review) and
  foundation/.
  Data: /api/review (review_screen.document: each open batch and its open questions; a blind or sealed batch sends text and
  options only), read when the page opens, on Read again and after a failed or stale write.
  Writes: /api/review/rule (a label) and /api/review/withdraw (its Undo), each sd_db.review, the code sd-db review runs;
  a comment (n) posts the shell capture's note route on the batch as "On note #N: ...". Download reads
  /api/review/<item>/export, the lines sd-db review export writes. Nothing here is sample data.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review · system</title>
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<script src="/ui/theme.js"></script>
<script src="/ui/markup.js"></script>
<script src="/ui/annunciator-strip.js"></script>
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/ui/annunciator-strip.css">
<link rel="stylesheet" href="/ui/review.css">
</head>
<body data-page="Review" data-scope="fleet">
<script src="/ui/icons.js"></script>
<div class="shell">
<main id="main">
  <header class="head">
    <div>
      <h1>Review</h1>
      <p class="progress" id="sub">Reading the review queue…</p>
    </div>
    <button class="btn quiet sm" type="button" id="reload">Read again</button>
  </header>
  <div id="state" hidden></div>
  <h2 class="sr">Open batches</h2>
  <annunciator-strip><ul class="annunciator" id="annunciator" hidden></ul></annunciator-strip>
  <section aria-labelledby="led-h">
    <div class="sec-head">
      <h2 id="led-h">Open questions</h2>
      <p class="tally" id="tally"></p>
    </div>
    <table class="ledger review" aria-labelledby="led-h">
      <thead><tr><th scope="col" class="g"><span class="sr">State</span></th><th scope="col">Question</th><th scope="col">Batch</th><th scope="col">Asked</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<div class="details" id="details"><p class="note">Select a question. Digits 1 to 9 label it; j and k move without a label.</p></div>
</div>
<script src="/ui/sections.js"></script>
<script src="/ui/review.js"></script>
<script src="/ui/shell.js"></script>
</body>
</html>
