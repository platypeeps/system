<!doctype html>
<!--
  GitHub (sd:5781), at /github: Today's GitHub and Issues views until sd:5781, in three views.
  Pull requests (sd:5608): /api/today/github, the operator's open pull requests and issues and those merged or closed in
  the last 7 days, from what sd shadow sync and the Contributions collector stored (today_github.document), read by
  today-github.js when the page opens on it and on Read again. A pull request row selects into Details (sd:5633).
  Your issues (sd:4628): each repo's issues assigned to or filed by the operator; Intake (sd:4840): each github_issues
  repo's open third-party issues no item carries, File as item posts /api/items with the ref. Both are /api/github/issues
  (issues.document, issues.intake), read by github.js when either view first shows and on Read again; issues.js draws them.
  The page's styles are Today's (today.css) and the issue ledger's (issues.css): the rows moved, their look did not.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitHub · system</title>
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<script src="/ui/theme.js"></script>
<script src="/ui/markup.js"></script>
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/ui/today.css">
<link rel="stylesheet" href="/ui/issues.css">
</head>
<body data-page="GitHub" data-scope="fleet">
<script src="/ui/icons.js"></script>
<div class="shell">
  <main>
    <header class="head">
      <div>
        <h1>GitHub</h1>
      </div>
    </header>
    <!-- The toolbar standard (sd:5281): row 1, the views then the shell's Shapeshift bar (sd:5539). -->
    <div class="toolbar" id="toolbar" data-shift></div>

    <div id="view-pulls" aria-label="Pull requests">
      <section aria-labelledby="github-h">
        <div class="sec-head">
          <h2 id="github-h">Pull requests <button class="help" type="button" aria-label="Help: Pull requests" data-help="&lt;b&gt;Your pull requests and issues.&lt;/b&gt; Open pull requests that are yours, assigned to you or waiting on you; open issues that are yours or opened by someone else in a repo with GitHub issues on; and both merged or closed in the last 7 days. Upstream is yours in a repo sd does not register. Show mine, the default, hides what others opened; Show all adds every open pull request in a registered repo. Newest GitHub activity first; each part shows 5 rows, Show all opens the rest. Read from what &lt;code&gt;sd shadow sync&lt;/code&gt; and the Contributions collector stored: the reading calls no GitHub API. Press a pull request for its details and actions; Copilot review asks GitHub, once per press. Your issues and Intake are their own tabs, with Jira and File as item.">
            <svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button></h2>
          <p class="tally" id="github-tally"></p>
        </div>
        <div class="filters toolbar-2" id="github-filters"></div>
        <div id="github-sections"><p class="st-line">Reading GitHub…</p></div>
      </section>
    </div>
    <div id="view-issues" aria-label="Your issues" hidden>
      <section class="issues-sec" aria-labelledby="issues-h">
        <div class="sec-head">
          <h2 id="issues-h">Your issues <button class="help" type="button" aria-label="Help: Your issues" data-help="&lt;b&gt;Issues that are yours.&lt;/b&gt; Open Jira and GitHub issues assigned to you or filed by you, from each repo&#39;s issue sources (&lt;code&gt;jira=KEY&lt;/code&gt;, &lt;code&gt;github=owner/name&lt;/code&gt; on the repo&#39;s channels). Watched issues stay synced and are not listed. &lt;code&gt;sd shadow sync&lt;/code&gt; refreshes them.">
            <svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button></h2>
          <p class="tally" id="issues-tally"></p>
        </div>
        <table class="ledger issues" aria-labelledby="issues-h">
          <thead><tr><th>Issue</th><th>Title</th><th>Repo</th><th>Why</th></tr></thead>
          <tbody id="issues"><tr class="empty"><td colspan="4">Reading issues…</td></tr></tbody>
        </table>
      </section>
    </div>
    <div id="view-intake" aria-label="Intake" hidden>
      <section class="issues-sec" aria-labelledby="intake-h">
        <div class="sec-head">
          <h2 id="intake-h">Issue intake <button class="help" type="button" aria-label="Help: Issue intake" data-help="&lt;b&gt;Issues that need an item.&lt;/b&gt; Open GitHub issues someone else opened, in each repo with GitHub issues on (Management), that no item carries yet. File as item adds a task in that repo under &lt;code&gt;--ref github:owner/name#N&lt;/code&gt;, as &lt;code&gt;sd task add --ref&lt;/code&gt; does, and the row leaves. &lt;code&gt;sd shadow sync&lt;/code&gt; refreshes them.">
            <svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button></h2>
          <p class="tally" id="intake-tally"></p>
        </div>
        <table class="ledger issues" aria-labelledby="intake-h">
          <thead><tr><th>Issue</th><th>Title</th><th>Repo</th><th>Opened by</th><th><span class="sr">File</span></th></tr></thead>
          <tbody id="intake"><tr class="empty"><td colspan="5">Reading issue intake…</td></tr></tbody>
        </table>
      </section>
    </div>
  </main>

  <div class="details" id="details"><p class="why">Press a pull request for its details.</p></div>
</div>
<script src="/ui/sections.js"></script>
<script src="/ui/commands.js"></script>
<script src="/ui/github.js"></script>
<script src="/ui/issues.js"></script>
<script src="/ui/today-github.js"></script>
<script src="/ui/shell.js"></script>
</body>
</html>
