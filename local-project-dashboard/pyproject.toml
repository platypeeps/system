# The build backend is in this folder, not on PyPI, for the reason `_build.py`
# gives and `local-sd-db/_build.py` gave first: a pure-Python package with no
# third-party dependencies does not need setuptools, and fetching setuptools
# would make an offline install fail for a reason that has nothing to do with
# this package.
[build-system]
requires = []
build-backend = "_build"
backend-path = ["."]

[project]
name = "sd-dashboard"
version = "0.1.0"
description = "The dashboard, its screens and its loopback server."
requires-python = ">=3.13"
dependencies = ["sd-db"]

# Note: the metadata above is the declaration; `_build.py` carries the copy
# that reaches the wheel, and `tests/test_installed.py` asserts they agree.
