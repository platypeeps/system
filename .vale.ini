# Prose lint for this repository's Markdown (Vale, https://vale.sh).
# Advisory: nothing in `make check` runs it; the sd-prose-lint skill and a
# human do. `vale sync` fetches the packages into .vale/styles, which is
# gitignored except for config/, where the vocabulary lives.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = write-good, proselint, alex
Vocab = system

[*.md]
BasedOnStyles = Vale, write-good, proselint, alex
# E-Prime flags every "is" and "was"; too noisy for technical prose.
write-good.E-Prime = NO
# Flags "failure", "failed", "hook", "killed", "dead": the vocabulary of
# running jobs, not profanity.
alex.ProfanityUnlikely = NO
